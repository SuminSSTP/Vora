<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="AI search visibility consulting for companies" />
  <title>VORA | AI Search Visibility Consulting</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      --ink: #241b4b;
      --ink-soft: #5b537a;
      --paper: #f8f7ff;
      --white: #ffffff;
      --sand: #e9e4ff;
      --lime: #6c4dff;
      --line: rgba(36, 27, 75, .14);
      --muted: #716b8e;
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--paper); color: var(--ink); font: 16px/1.65 var(--font); letter-spacing: -.025em; word-break: keep-all; overflow-wrap: break-word; }
    a { color: inherit; }
    .container { width: min(calc(100% - 3rem), 1120px); margin: 0 auto; }
    .header { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid transparent; background: rgba(244,241,234,.82); backdrop-filter: blur(14px); transition: .2s; }
    .header.scrolled { border-color: var(--line); background: rgba(244,241,234,.96); }
    .nav { min-height: 82px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .logo { display: inline-flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 900; letter-spacing: -.06em; text-decoration: none; }
    .logo-mark { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 8px; background: var(--lime); color: var(--white); font-size: 13px; }
    .nav-links { display: flex; gap: 28px; margin-left: auto; }
    .nav-links a { color: var(--ink-soft); text-decoration: none; font-size: 14px; font-weight: 700; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border: 0; border-radius: 11px; background: var(--ink); color: var(--white); text-decoration: none; font: 800 14px var(--font); transition: transform .18s ease, box-shadow .18s ease; cursor: pointer; }
    .button:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(21,34,30,.15); }
    .button.lime { background: var(--lime); color: var(--white); }
    .button.small { min-height: 40px; padding: 0 14px; font-size: 13px; }
    .hero { padding: clamp(72px, 11vw, 140px) 0 100px; overflow: hidden; }
    .hero-grid { display: grid; grid-template-columns: .95fr .8fr; align-items: center; gap: clamp(48px, 8vw, 105px); }
    .eyebrow { margin: 0 0 16px; color: #6246c8; font-size: 12px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
    h1, h2, h3, p { margin: 0; }
    h1, h2 { white-space: pre-line; text-wrap: balance; letter-spacing: -.07em; line-height: 1.14; }
    h1 { max-width: 15ch; font-size: clamp(46px, 5.3vw, 74px); }
    h2 { max-width: 14ch; font-size: clamp(36px, 4.3vw, 60px); }
    .hero-copy > p:not(.eyebrow) { max-width: 550px; margin-top: 24px; color: var(--ink-soft); font-size: 18px; line-height: 1.8; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; margin-top: 34px; }
    .underlink { border-bottom: 1px solid var(--ink); padding-bottom: 2px; font-size: 14px; font-weight: 900; text-decoration: none; }
    .reassurance { margin-top: 16px !important; color: var(--muted) !important; font-size: 12px !important; }
    .ai-card { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: var(--white); box-shadow: 24px 24px 0 var(--sand); }
    .ai-card-top { display: flex; align-items: center; gap: 8px; min-height: 55px; padding: 0 20px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 800; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #6c4dff; box-shadow: 0 0 0 4px rgba(108,77,255,.2); }
    .model { margin-left: auto; font-size: 10px; letter-spacing: .08em; }
    .ai-card-body { padding: 22px; }
    .prompt { display: flex; gap: 10px; padding: 16px; border-radius: 12px 12px 12px 3px; background: var(--ink); color: var(--white); font-size: 14px; line-height: 1.55; }
    .prompt b { color: #c7bbff; font-size: 20px; line-height: 1; }
    .answer { padding: 22px 6px 14px; color: var(--ink-soft); font-size: 14px; }
    .answer-title { margin-bottom: 8px; color: var(--ink); font-size: 12px; font-weight: 900; }
    .answer ul { display: grid; gap: 7px; padding: 0; margin: 13px 0 0; list-style: none; }
    .answer li::before { content: "✓"; margin-right: 8px; color: #6246c8; font-weight: 900; }
    .gap { display: flex; gap: 10px; align-items: center; padding: 13px; border: 1px dashed #6c4dff; border-radius: 10px; background: #f2efff; color: #4f3a9b; font-size: 12px; font-weight: 800; line-height: 1.45; }
    .gap strong { display: grid; place-items: center; flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; background: #c7bbff; color: #241b4b; }
    .strip { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--white); }
    .strip-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
    .strip-item { display: flex; gap: 13px; align-items: baseline; min-height: 94px; padding: 22px 30px; border-left: 1px solid var(--line); }
    .strip-item:last-child { border-right: 1px solid var(--line); }
    .strip-item strong { color: #6246c8; font-size: 21px; letter-spacing: -.06em; }
    .strip-item span { color: var(--muted); font-size: 12px; font-weight: 700; }
    section { padding: clamp(80px, 10vw, 140px) 0; }
    .section-heading { max-width: 700px; }
    .section-heading > p:last-child { max-width: 670px; margin-top: 20px; color: var(--ink-soft); font-size: 16px; line-height: 1.85; }
    .dark { background: var(--ink); color: var(--white); }
    .dark .eyebrow { color: #c7bbff; }
    .dark .section-heading > p:last-child { color: #bdc8bf; }
    .problem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 48px; }
    .problem-card { min-height: 246px; padding: 24px; border: 1px solid rgba(255,255,255,.17); border-radius: 16px; background: rgba(255,255,255,.035); }
    .problem-card::before { content: ""; display: block; width: 30px; height: 3px; margin-bottom: 70px; background: #c7bbff; }
    .problem-card h3 { font-size: 18px; letter-spacing: -.04em; }
    .problem-card p { margin-top: 10px; color: #bdc8bf; font-size: 13px; line-height: 1.75; }
    .service-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 48px; }
    .service { position: relative; min-height: 320px; padding: 27px; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--white); }
    .service::after { content: ""; position: absolute; right: -56px; bottom: -56px; width: 150px; height: 150px; border-radius: 50%; background: var(--sand); transition: transform .25s ease; }
    .service:hover::after { transform: scale(1.22); }
    .number { display: grid; place-items: center; width: 39px; height: 39px; border-radius: 50%; background: var(--sand); color: #6246c8; font-size: 12px; font-weight: 900; }
    .service h3 { position: relative; z-index: 1; margin-top: 68px; font-size: 22px; letter-spacing: -.055em; }
    .service p { position: relative; z-index: 1; max-width: 480px; margin-top: 12px; color: var(--ink-soft); font-size: 14px; line-height: 1.8; }
    .tags { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; }
    .tags span { padding: 4px 8px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); font-size: 10px; font-weight: 800; }
    .sand { background: var(--sand); }
    .about { display: block; }
    .credentials { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 38px; }
    .credential { min-height: 150px; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--white); }
    .credential strong { display: block; color: #6246c8; font-size: 12px; letter-spacing: .08em; }
    .credential h3 { margin-top: 25px; font-size: 16px; letter-spacing: -.04em; }
    .credential p { margin-top: 6px; color: var(--ink-soft); font-size: 12px; line-height: 1.6; }
    .approach { display: grid; grid-template-columns: .83fr 1.17fr; gap: clamp(45px, 10vw, 120px); }
    .steps { padding: 0; margin: 0; list-style: none; border-top: 1px solid var(--line); }
    .step { display: grid; grid-template-columns: 55px 1fr; gap: 12px; padding: 23px 0; border-bottom: 1px solid var(--line); }
    .step-no { color: #6246c8; font-size: 12px; font-weight: 900; }
    .step h3 { font-size: 17px; }
    .step p { margin-top: 5px; color: var(--ink-soft); font-size: 13px; line-height: 1.75; }
    .industries { display: grid; grid-template-columns: .82fr 1.18fr; gap: clamp(45px, 10vw, 120px); }
    .industry-list { display: grid; grid-template-columns: repeat(2, 1fr); align-content: start; gap: 12px; }
    .industry-list span { padding: 22px 18px; border: 1px solid var(--line); border-radius: 13px; background: var(--white); font-size: 14px; font-weight: 800; }
    .industry-list span:nth-child(even) { transform: translateY(24px); }
    .contact { display: grid; grid-template-columns: .9fr 1fr; gap: clamp(45px, 9vw, 100px); align-items: start; }
    .contact-list { display: grid; gap: 12px; padding: 0; margin: 28px 0 0; list-style: none; color: #d9e1da; font-size: 14px; }
    .contact-list li::before { content: "↗"; margin-right: 10px; color: #c7bbff; font-weight: 900; }
    .form { display: grid; gap: 15px; padding: clamp(20px, 3vw, 32px); border-radius: 16px; background: var(--white); color: var(--ink); }
    .form label { display: grid; gap: 6px; font-size: 12px; font-weight: 900; }
    input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 12px; outline: none; background: #fffefa; color: var(--ink); font: 14px var(--font); }
    input:focus, textarea:focus { border-color: #6c4dff; box-shadow: 0 0 0 3px rgba(108,77,255,.2); }
    textarea { resize: vertical; }
    .form-note { color: var(--muted); font-size: 11px; line-height: 1.55; }
    .form-status { min-height: 20px; margin: -3px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .form-status.success { color: #276b46; }
    .form-status.error { color: #ad3e3e; }
    footer { padding: 35px 0; border-top: 1px solid var(--line); }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; color: var(--muted); font-size: 12px; }
    .email { color: var(--ink-soft); font-weight: 800; }
    .reveal { opacity: 0; transform: translateY(18px); transition: opacity .65s ease, transform .65s ease; }
    .reveal.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 840px) { .nav-links { display: none; } .hero-grid, .approach, .industries, .contact { grid-template-columns: 1fr; } .hero-grid { gap: 48px; } .problem-grid { grid-template-columns: 1fr; } .problem-card { min-height: auto; } .problem-card::before { margin-bottom: 36px; } }
    @media (max-width: 600px) { .container { width: min(calc(100% - 2rem), 1120px); } .nav { min-height: 70px; } .nav .button { min-height: 38px; padding: 0 11px; font-size: 11px; } .hero { padding-top: 66px; } .ai-card { box-shadow: 12px 12px 0 var(--sand); } .strip-grid, .service-grid, .industry-list { grid-template-columns: 1fr; } .strip-item, .strip-item:last-child { min-height: auto; border-right: 0; border-left: 0; border-bottom: 1px solid var(--line); } .strip-item:last-child { border-bottom: 0; } .industry-list span:nth-child(even) { transform: none; } .footer { align-items: flex-start; flex-direction: column; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="header" id="header">
    <nav class="container nav">
      <a class="logo" href="#top"><span class="logo-mark">V</span><span>VORA</span></a>
      <div class="nav-links"><a href="#services" id="navServices"></a><a href="#about" id="navAbout"></a><a href="#approach" id="navApproach"></a><a href="#industries" id="navIndustries"></a></div>
      <a class="button small" href="#contact" id="navContact"></a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="container hero-grid">
        <div class="hero-copy reveal">
          <p class="eyebrow" id="heroEyebrow"></p>
          <h1 id="heroTitle"></h1>
          <p id="heroDescription"></p>
          <div class="actions"><a class="button lime" href="#contact" id="heroCta"></a><a class="underlink" href="#problem" id="heroLink"></a></div>
          <p class="reassurance" id="heroReassurance"></p>
        </div>
        <div class="ai-card reveal" id="aiCard"></div>
      </div>
    </section>

    <section class="strip"><div class="container strip-grid" id="proofStrip"></div></section>

    <section class="dark" id="problem">
      <div class="container">
        <div class="section-heading reveal"><p class="eyebrow" id="problemEyebrow"></p><h2 id="problemTitle"></h2><p id="problemDescription"></p></div>
        <div class="problem-grid" id="problemGrid"></div>
      </div>
    </section>

    <section id="services">
      <div class="container">
        <div class="section-heading reveal"><p class="eyebrow" id="servicesEyebrow"></p><h2 id="servicesTitle"></h2><p id="servicesDescription"></p></div>
        <div class="service-grid" id="serviceGrid"></div>
      </div>
    </section>

    <section class="sand" id="about">
      <div class="container about">
        <div class="section-heading reveal"><p class="eyebrow" id="aboutEyebrow"></p><h2 id="aboutTitle"></h2><p id="aboutDescription"></p><div class="credentials" id="credentials"></div></div>
      </div>
    </section>

    <section class="sand" id="approach">
      <div class="container approach"><div class="section-heading reveal"><p class="eyebrow" id="approachEyebrow"></p><h2 id="approachTitle"></h2></div><ol class="steps" id="steps"></ol></div>
    </section>

    <section id="industries">
      <div class="container industries"><div class="section-heading reveal"><p class="eyebrow" id="industriesEyebrow"></p><h2 id="industriesTitle"></h2><p id="industriesDescription"></p></div><div class="industry-list reveal" id="industryList"></div></div>
    </section>

    <section class="dark" id="contact">
      <div class="container contact">
        <div class="section-heading reveal"><p class="eyebrow" id="contactEyebrow"></p><h2 id="contactTitle"></h2><p id="contactDescription"></p><ul class="contact-list" id="contactList"></ul></div>
        <form class="form reveal" id="contactForm">
          <label><span id="formNameLabel"></span><input name="name" required autocomplete="name" /></label>
          <label><span id="formCompanyLabel"></span><input name="company" required autocomplete="organization" /></label>
          <label><span id="formEmailLabel"></span><input name="email" type="email" required autocomplete="email" /></label>
          <label><span id="formMessageLabel"></span><textarea name="message" rows="4"></textarea></label>
          <input name="submittedAt" type="hidden" />
          <input name="language" type="hidden" />
          <button class="button lime" type="submit" id="formSubmit"></button>
          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer><div class="container footer"><a class="logo" href="#top"><span class="logo-mark">V</span><span>VORA</span></a><p id="footerText"></p><a class="email" id="emailLink"></a></div></footer>
  <iframe name="leadSubmissionFrame" title="Lead submission" hidden></iframe>

  <script>
    /* EDITABLE ENGLISH CONTENT */
    const content = {
      contactEmail: "jinyoung@voragroup.org",
      // Google Apps Script Web App that safely appends contact submissions to the private sheet.
      formEndpoint: "https://script.google.com/macros/s/AKfycbyCVZWuynoFSZMDVdb8Zdh2DzLv2blN0ZPajBY6WVcinShF9vdIelO5Kzrn3s2ZjR4yWw/exec",
      nav: ["Services", "About", "Approach", "Industries", "Contact"],
      hero: ["Brand visibility for the AI search era", "When customers\nask AI, your\nbrand becomes\nthe answer.", "VORA helps companies become more accurately understood and credibly mentioned across AI search environments including ChatGPT, Gemini, and Perplexity.", "Book a free 20-minute audit", "What is GEO?  ↘", "The first conversation is free. We clarify your current position and priorities instead of making inflated promises."],
        query: ["AI search example", "How AI evaluates trust signals", "Recommend a high-end restaurant in my area", "AI typically looks for these trust signals together.", ["A distinctive dining concept and chef profile", "Recent, verifiable guest reviews and editorial coverage", "Consistent location, menu, and reservation information"], "There may not yet be enough signals for AI to understand the restaurant accurately."],
        proof: [["GEO", "Generative Engine Optimization"], ["AI VIS", "Visibility across multiple GenAI models"], ["1:1", "Strategy tailored to industry and competition"]],
        problem: ["Why GEO, now", "The way people see\nsearch results is changing.", "Customers no longer only scan a list of links. They explain their situation to AI and receive a few names with reasons. What matters is not only visibility, but how accurately AI understands a brand's expertise, context, and credibility.", [["AI compresses the answer", "Instead of countless search results, AI summarizes a small set of brands that fit the context. The criteria for becoming a candidate are changing."], ["Consistency creates trust", "When information differs across your website, articles, reviews, and directories, AI has a harder time being confident about your brand."], ["Good content is not enough", "Content quality matters, but structure, sources, entity information, and industry context need to work together."]]],
        services: ["Services", "Build the foundation for AI\nto understand your brand.", "This is not a short-term keyword exercise. It is the work of organizing brand information and trust signals, starting with the scope that matters most.", [["01", "AI Visibility Audit", "We assess AI search results and your competitive context through questions your customers are likely to ask. You receive a clear view of perception gaps and priorities.", ["Question map", "Competitor review", "Audit report"]], ["02", "Brand Entity Foundation", "We organize fragmented brand, product, and expertise information across your website and external channels into a structure people and AI can understand.", ["Messaging", "Schema", "Information consistency"]], ["03", "AI-Ready Content Strategy", "We shape content themes, formats, and proof around customer decision stages and real questions, so your internal team can continue the work with confidence.", ["Content map", "FAQ", "Evidence design"]], ["04", "Ongoing Monitoring & Advisory", "We monitor priority questions and competitors, interpret changes, and decide the next improvements in a practical order.", ["Monthly review", "Insights", "Execution advisory"]]]],
        about: ["About VORA", "A practical partner for\nthe AI search era.", "VORA works at the intersection of technology, content, and brand strategy to shape AI search visibility. We care less about merely appearing in AI responses and more about brands being understood accurately and credibly in the moments that matter. Edit this introduction and the credentials below to reflect your real team.", [["EXPERTISE", "GEO & Search Strategy", "AI search audits, entity foundations, and content structure"], ["FOCUS", "Hong Kongese/Sinagporean Market Context", "Strategies that consider multiple search engines and global AI environments"], ["WORKING STYLE", "Actionable Advisory", "Clear priorities and documentation your internal team can use"], ["CREDENTIALS", "Add your real credentials", "Add education, past companies, projects, certifications, or media contributions here."]]],
        approach: ["Approach", "Measure, organize,\nand keep validating.", [["Discover", "We quickly understand your business, customer questions, and competitive environment, then agree on what should be measured."], ["Diagnose", "We examine the AI search environment and existing brand assets, separating visible symptoms from their causes."], ["Design", "We create an improvement roadmap based on impact and effort, including what the internal team can own."], ["Validate", "We check the changes, form the next hypothesis, and keep learning. GEO is not a one-time setup."]]],
        industries: ["Industries", "Especially useful for brands\nthat need to explain more.", "GEO plays a stronger role where expertise, trust, and comparison matter in the purchase decision.", ["B2B SaaS · IT", "Professional Services · Consulting", "Healthcare · Wellness", "Education · EdTech", "Premium Consumer Brands", "Local · Franchise"]],
      contact: ["Contact", "How does AI see\nyour brand today?", "In 20 minutes, we will understand your current situation and outline the first questions and GEO approach worth exploring.", ["What to examine first", "What your team can handle internally and where outside help may matter", "Likely audit scope and timeline"], ["Name", "Company", "Email", "Current challenge or message", "Send inquiry"], "© 2026 VORA. AI search visibility consulting."]
    };

    const set = (id, value) => document.getElementById(id).textContent = value;
    const list = (id, items, create) => document.getElementById(id).replaceChildren(...items.map(create));
    const observe = () => document.querySelectorAll(".reveal:not(.show)").forEach(el => observer.observe(el));
    const render = () => {
      const copy = content;
      document.title = "VORA | AI Search Visibility Consulting";
      ["navServices", "navAbout", "navApproach", "navIndustries", "navContact"].forEach((id, index) => set(id, copy.nav[index]));
      ["heroEyebrow", "heroTitle", "heroDescription", "heroCta", "heroLink", "heroReassurance"].forEach((id, index) => set(id, copy.hero[index]));
      const [queryLabel, answerLabel, prompt, lead, queryItems, missing] = copy.query;
      document.getElementById("aiCard").innerHTML = `<div class="ai-card-top"><span class="dot"></span><span>${queryLabel}</span><span class="model">GENERATIVE SEARCH</span></div><div class="ai-card-body"><div class="prompt"><b>›</b><span>${prompt}</span></div><div class="answer"><p class="answer-title">✦ ${answerLabel}</p><p>${lead}</p><ul>${queryItems.map(item => `<li>${item}</li>`).join("")}</ul></div><div class="gap"><strong>!</strong><span>${missing}</span></div></div>`;
      list("proofStrip", copy.proof, ([value, label]) => { const el = document.createElement("div"); el.className = "strip-item"; el.innerHTML = `<strong>${value}</strong><span>${label}</span>`; return el; });
      ["problemEyebrow", "problemTitle", "problemDescription"].forEach((id, index) => set(id, copy.problem[index]));
      list("problemGrid", copy.problem[3], ([title, body]) => { const el = document.createElement("article"); el.className = "problem-card reveal"; el.innerHTML = `<h3>${title}</h3><p>${body}</p>`; return el; });
      ["servicesEyebrow", "servicesTitle", "servicesDescription"].forEach((id, index) => set(id, copy.services[index]));
      list("serviceGrid", copy.services[3], ([number, title, body, tags]) => { const el = document.createElement("article"); el.className = "service reveal"; el.innerHTML = `<span class="number">${number}</span><h3>${title}</h3><p>${body}</p><div class="tags">${tags.map(tag => `<span>${tag}</span>`).join("")}</div>`; return el; });
      ["aboutEyebrow", "aboutTitle", "aboutDescription"].forEach((id, index) => set(id, copy.about[index]));
      list("credentials", copy.about[3], ([label, title, body]) => { const el = document.createElement("article"); el.className = "credential"; el.innerHTML = `<strong>${label}</strong><h3>${title}</h3><p>${body}</p>`; return el; });
      ["approachEyebrow", "approachTitle"].forEach((id, index) => set(id, copy.approach[index]));
      list("steps", copy.approach[2], ([title, body], index) => { const el = document.createElement("li"); el.className = "step reveal"; el.innerHTML = `<span class="step-no">${String(index + 1).padStart(2, "0")}</span><div><h3>${title}</h3><p>${body}</p></div>`; return el; });
      ["industriesEyebrow", "industriesTitle", "industriesDescription"].forEach((id, index) => set(id, copy.industries[index]));
      list("industryList", copy.industries[3], item => { const el = document.createElement("span"); el.textContent = item; return el; });
      ["contactEyebrow", "contactTitle", "contactDescription"].forEach((id, index) => set(id, copy.contact[index]));
      list("contactList", copy.contact[3], item => { const el = document.createElement("li"); el.textContent = item; return el; });
      ["formNameLabel", "formCompanyLabel", "formEmailLabel", "formMessageLabel", "formSubmit"].forEach((id, index) => set(id, copy.contact[4][index]));
      set("footerText", copy.contact[5]);
      const email = document.getElementById("emailLink"); email.href = `mailto:${content.contactEmail}`; email.textContent = content.contactEmail;
      ["navContact", "heroCta"].forEach(id => {
        const link = document.getElementById(id);
        link.href = "#contact";
        link.removeAttribute("target");
        link.removeAttribute("rel");
      });
      observe();
    };
    const observer = new IntersectionObserver(entries => entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add("show"); observer.unobserve(entry.target); } }), { threshold: .12 });
    document.getElementById("contactForm").addEventListener("submit", event => {
      event.preventDefault();
      const form = event.currentTarget;
      const submit = document.getElementById("formSubmit");
      const status = document.getElementById("formStatus");
      const messages = { configuring: "The inquiry form is still being configured. Please try again shortly.", sending: "Sending your inquiry.", success: "Your inquiry has been received. We will be in touch shortly.", error: "We could not send your inquiry. Please email us instead." };

      if (!content.formEndpoint) {
        status.className = "form-status error";
        status.textContent = messages.configuring;
        return;
      }

      form.elements.submittedAt.value = new Date().toISOString();
      form.elements.language.value = "en";
      form.action = content.formEndpoint;
      form.method = "post";
      form.target = "leadSubmissionFrame";
      submit.disabled = true;
      status.className = "form-status";
      status.textContent = messages.sending;

      // A form targeted at a hidden iframe avoids cross-origin restrictions while keeping
      // visitors on this page. The Apps Script appends the values to the private sheet.
      form.submit();
      window.setTimeout(() => {
        form.reset();
        status.className = "form-status success";
        status.textContent = messages.success;
        submit.disabled = false;
      }, 500);
    });
    const header = document.getElementById("header"); addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 8), { passive: true });
    render();
  </script>
</body>
</html>
